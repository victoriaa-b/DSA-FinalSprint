<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Previous Trees</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
<h1>Previous Binary Search Trees</h1>

<div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Input Numbers</th>
            <th>Tree Structure</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tree : ${trees}">
            <td th:text="${tree.id}"></td>
            <td th:text="${tree.inputNum}"></td>
            <td th:text="${tree.treeStructure}"></td>
            <td>
                <a th:href="@{/api/trees/{id}(id=${tree.id})}">View Tree</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<p><a th:href="@{/}">Back to Home</a></p>
</body>
</html>
